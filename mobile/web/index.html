<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gestion_ganadera">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gestion_ganadera</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      const pending = new Map();
      const widgets = new Map();

      function publish(name, detail) {
        window.dispatchEvent(new CustomEvent(name, { detail: JSON.stringify(detail) }));
      }

      function render(viewId) {
        const element = document.getElementById("gavac-recaptcha-" + viewId);
        const options = pending.get(viewId);
        if (!element || !options || !window.grecaptcha || widgets.has(viewId)) return;
        widgets.set(viewId, window.grecaptcha.render(element, {
          sitekey: options.siteKey,
          callback: function (token) {
            publish("gavacRecaptchaToken", { viewId: viewId, token: token });
          },
          "expired-callback": function () {
            publish("gavacRecaptchaExpired", { viewId: viewId });
          },
          "error-callback": function () {
            publish("gavacRecaptchaError", { viewId: viewId });
          }
        }));
      }

      window.gavacRecaptchaApiReady = function () {
        pending.forEach(function (_, viewId) { render(viewId); });
      };
      window.gavacRenderRecaptcha = function (viewId, siteKey) {
        pending.set(viewId, { siteKey: siteKey });
        if (window.grecaptcha && window.grecaptcha.render) render(viewId);
      };
      window.gavacResetRecaptcha = function (viewId) {
        const widgetId = widgets.get(viewId);
        if (window.grecaptcha && widgetId !== undefined) window.grecaptcha.reset(widgetId);
      };
    })();
  </script>
  <script
    src="https://www.google.com/recaptcha/api.js?onload=gavacRecaptchaApiReady&amp;render=explicit"
    async defer>
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.

    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
