
services:
  db_api:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_ganadera
      POSTGRES_USER: ganadero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganadero -d gestion_ganadera"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_api_data:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db_api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ganadero:${POSTGRES_PASSWORD}@db_api:5432/gestion_ganadera
      JWT_EXPIRE_MINUTES: "60"
      ENVIRONMENT: "development"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    command: ["sh", "-c", "alembic -c /app/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

volumes:
  postgres_api_data:
