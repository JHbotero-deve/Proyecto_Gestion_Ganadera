
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_ganadera
      POSTGRES_USER: ganadero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ganadero:${POSTGRES_PASSWORD}@db:5432/gestion_ganadera
      JWT_EXPIRE_MINUTES: "60"
      ENVIRONMENT: "development"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:8000"
    ports:
      - "8001:8000"

volumes:
  postgres_data:
