services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_ganadera
      POSTGRES_USER: ganadero
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://ganadero:password123@db:5432/gestion_ganadera
      JWT_SECRET_KEY: supersecretjwtkeyganaduerasecure2026withmoresigns
      JWT_EXPIRE_MINUTES: 60
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000,http://10.0.2.2:8001
    ports:
      - "8001:8000"

volumes:
  postgres_data: