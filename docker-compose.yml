services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_ganadera}
      POSTGRES_USER: ${POSTGRES_USER:-ganadero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_clave_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ganadero}:${POSTGRES_PASSWORD:-cambiar_esta_clave_local}@db:5432/${POSTGRES_DB:-gestion_ganadera}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cambiar_por_una_clave_aleatoria_larga}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
